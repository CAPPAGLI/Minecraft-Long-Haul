[search]
	# EMI handles recipe/item search UI; disable JEI's redundant search trees to save RAM in 12 GB heap.
	modNameSearchMode = DISABLED
	tooltipSearchMode = DISABLED
	tagSearchMode = DISABLED
	colorSearchMode = DISABLED
	resourceLocationSearchMode = DISABLED
	creativeTabSearchMode = DISABLED
	searchAdvancedTooltips = false
	searchModIds = false
	searchModAliases = false
	searchShortModNames = false
	searchIngredientAliases = false

[lookups]
	lookupFluidContentsEnabled = false
	lookupBlockTagsEnabled = false
