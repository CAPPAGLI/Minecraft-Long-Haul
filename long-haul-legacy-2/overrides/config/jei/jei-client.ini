[advanced]
	CenterSearch = false
	# EMI handles recipe/item search UI; enable JEI low-memory mode so JEI does not hold duplicate suffix-tree search indices in 12 GB heap.
	LowMemorySlowSearchEnabled = true
	CheatToHotbarUsingHotkeysEnabled = false
	AddBookmarksToFrontEnabled = true
	LookupFluidContents = false
	GiveMode = MOUSE_PICKUP
	RecipeGuiHeight = 350

[search]
	ModNameSearchMode = DISABLED
	TooltipSearchMode = DISABLED
	TagSearchMode = DISABLED
	ColorSearchMode = DISABLED
	ResourceLocationSearchMode = DISABLED
	SearchAdvancedTooltips = false
