# Safe ModernFix memory & resource-reload optimizations for Long Haul Legacy 2.0 (Forge 1.20.1)
# Keep dynamic_resources and faster_item_rendering disabled to preserve Athena/Chipped and Clockwork/Valkyrien Skies compatibility.
mixin.perf.dynamic_resources=false
mixin.perf.faster_item_rendering=false
mixin.perf.deduplicate_location=true
mixin.perf.deduplicate_climate_parameters=true
mixin.perf.compact_bit_storage=true
mixin.perf.cache_strongholds=true
mixin.bugfix.packet_leak=true
