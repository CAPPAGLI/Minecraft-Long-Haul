# ModernFix memory & resource optimizations for Long Haul Legacy 2.0 (Forge 1.20.1, 440+ mods)
# Matches ATM9 / Prominence II 1.20.1 pattern for 10-12 GB RAM:
# dynamic_resources=true is verified with ModernFix 5.27+ / Athena 3.1.2 / Chipped 3.0.7 and saves ~3-5 GB of Java heap.
# Keep faster_item_rendering=false to preserve Valkyrien Skies / Create: Clockwork item rendering compatibility.
mixin.perf.dynamic_resources=true
mixin.perf.faster_item_rendering=false
mixin.perf.dynamic_structure_manager=true
mixin.perf.blast_search_trees=true
mixin.perf.cache_blockstate_cache_arrays=true
mixin.perf.deduplicate_location=true
mixin.perf.deduplicate_climate_parameters=true
mixin.perf.deduplicate_wall_shapes=true
mixin.perf.compact_bit_storage=true
mixin.perf.cache_strongholds=true
mixin.perf.nbt_memory_usage=true
mixin.bugfix.packet_leak=true
mixin.bugfix.world_leaks=true
mixin.bugfix.chunk_deadlock=true
