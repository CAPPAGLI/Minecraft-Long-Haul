# Pre-tuned Distant Horizons 3.3.3+ defaults for Long Haul Legacy 2.0
# Uses DH 3.3.3 schema (_version = 5, [server] / [common.*] tables) so DH does not reset the file on startup.
# Keeps distant worldgen disabled (PRE_EXISTING_ONLY) and caps DH threads to avoid 12 GB OOM and chunk starvation.
_version = 5

[server]
	[common.lodBuilding]
		worldCompression = "VISUALLY_EQUAL"

	[common.multiThreading]
		numberOfThreads = 2
		threadRunTimeRatio = "0.5"
		threadPriority = 3

	[common.logging]
		[common.logging.warning]
			showLowMemoryWarningOnStart = false
			showGarbageCollectorWarning = false
			showModCompatibilityWarningsOnStartup = false
			showHighVanillaRenderDistanceWarning = false
			showSlowWorldGenSettingWarnings = false
			showUpdateQueueOverloadedChatWarning = false
			showPoolInsufficientMemoryWarning = false
			showExplicitGcDisabledWarning = false
			showReplayWarningOnStartup = false

	[common.worldGenerator]
		generatorPlan = "DISABLED"
		chunkGeneratorMode = "PRE_EXISTING_ONLY"
		limitIfServerUnhealthy = true
		pauseIfMovingQuickly = true
		showGenerationProgress = "DISABLED"

[client]
	showDhOptionsButtonInMinecraftUi = true

	[client.advanced.graphics]
		enableSsao = false
		overrideVanillaGraphicsSettings = true

		[client.advanced.graphics.noiseTexture]
			enableNoiseTexture = false

		[client.advanced.graphics.genericRendering]
			enableCloudRendering = false

		[client.advanced.graphics.quality]
			lodChunkRenderDistanceRadius = 64
			horizontalQuality = "MEDIUM"
			maxHorizontalResolution = "TWO_BLOCKS"
			verticalQuality = "MEDIUM"
			transparency = "FAKE"
			blocksToIgnore = "NON_COLLIDING"
			tintWithAvoidedBlocks = true
			lodShading = "AUTO"
			grassSideRendering = "FADE_TO_DIRT"
			ditherDhFade = true
			vanillaFadeMode = "SINGLE_PASS"
			dhFadeFarClipPlane = true
			lodBiomeBlending = 0
