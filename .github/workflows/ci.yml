name: Long Haul Legacy 2.0 Build & Smoke Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  issues: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Modrinth JARs
        uses: actions/cache@v4
        with:
          path: long-haul-legacy-2/assembly/mods
          key: modrinth-mods-${{ hashFiles('long-haul-legacy-2/assembly/lock.json') }}

      - name: Cache Forge 47.4.10 server libraries
        uses: actions/cache@v4
        with:
          path: long-haul-legacy-2/server-test/libraries
          key: forge-libs-1.20.1-47.4.10

      - name: Run pure-JS contract, planner, route & economy tests
        run: node long-haul-legacy-2/tools/test_contracts.js

      - name: Verify Heracles quest & advancement generation
        run: python3 long-haul-legacy-2/tools/generate_alpha_quests.py

      - name: Download & verify pinned mods from lock.json
        run: python3 long-haul-legacy-2/tools/assemble_alpha.py --from-lock

      - name: Prepare headless Forge 47.4.10 server (void fixture)
        run: python3 long-haul-legacy-2/tools/prepare_server.py --mode void

      - name: Build longhaul-runtime mod
        run: python3 long-haul-legacy-2/tools/build_runtime.py

      - name: Inspect JAR mod IDs & version ranges
        run: |
          mkdir -p /tmp/ci-logs
          python3 long-haul-legacy-2/tools/inspect_alpha.py | tee /tmp/ci-logs/inspect.txt

      - name: Re-sync runtime jar & run Forge headless void integration test
        run: |
          mkdir -p /tmp/ci-logs
          python3 long-haul-legacy-2/tools/prepare_server.py --mode void --skip-forge-install
          python3 long-haul-legacy-2/tools/smoke_server.py --heap 4096 --timeout 360 --world-label "alpha2 void integration test" | tee /tmp/ci-logs/smoke-void.txt
          cp long-haul-legacy-2/server-test/smoke-result.json /tmp/ci-logs/smoke-void-result.json

      - name: Run Forge headless normal Overworld generation test (Terralith + Tectonic + BOP + YUNG + Towns)
        run: |
          mkdir -p /tmp/ci-logs
          python3 long-haul-legacy-2/tools/prepare_server.py --mode normal --skip-forge-install
          python3 long-haul-legacy-2/tools/smoke_server.py --heap 4096 --timeout 420 --world-label "alpha2 normal overworld test" | tee /tmp/ci-logs/smoke-normal.txt
          cp long-haul-legacy-2/server-test/smoke-result.json /tmp/ci-logs/smoke-normal-result.json

      - name: Package .mrpack and source bundle
        run: python3 long-haul-legacy-2/tools/package_alpha.py --version 2.0-alpha.2 | tee /tmp/ci-logs/package.txt

      - name: Post diagnostic report to commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import os, pathlib, subprocess
          lines = ['### CI Diagnostic Report (`' + os.environ['GITHUB_SHA'][:7] + '`)', '']
          for label, p in [
              ('Inspect JARs', '/tmp/ci-logs/inspect.txt'),
              ('Void Smoke Result', '/tmp/ci-logs/smoke-void-result.json'),
              ('Normal Overworld Result', '/tmp/ci-logs/smoke-normal-result.json'),
              ('Package Summary', '/tmp/ci-logs/package.txt'),
              ('KubeJS Startup Log', 'long-haul-legacy-2/server-test/logs/kubejs/startup.log'),
              ('KubeJS Server Log', 'long-haul-legacy-2/server-test/logs/kubejs/server.log'),
          ]:
              fp = pathlib.Path(p)
              if fp.exists():
                  txt = fp.read_text(errors='replace')[-4000:]
                  lines.append(f'<details><summary>{label}</summary>\n\n```\n{txt}\n```\n</details>\n')
          sc = pathlib.Path('long-haul-legacy-2/server-test/smoke-console.log')
          if sc.exists():
              errs = [l for l in sc.read_text(errors='replace').splitlines() if ('ERROR' in l or 'FATAL' in l or 'Exception' in l or 'LH_INTEGRATION' in l)]
              lines.append(f'<details><summary>Console Errors/Highlights ({len(errs)})</summary>\n\n```\n' + '\n'.join(errs[-60:]) + '\n```\n</details>\n')
              tail = '\n'.join(sc.read_text(errors='replace').splitlines()[-60:])
              lines.append(f'<details><summary>Smoke Console Tail</summary>\n\n```\n{tail}\n```\n</details>\n')
          body = '\n'.join(lines)[:60000]
          subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments", '-f', f'body={body}'], check=False)
          PY

      - name: Upload build & test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-haul-legacy-2.0-alpha.2
          path: |
            Long-Haul-Legacy-2.0-alpha.2.mrpack
            Long-Haul-Legacy-2.0-alpha.2-Sources-and-Report.zip
            long-haul-legacy-2/server-test/smoke-result.json
            long-haul-legacy-2/server-test/smoke-console.log
            long-haul-legacy-2/server-test/logs/latest.log
            long-haul-legacy-2/server-test/logs/kubejs/
            long-haul-legacy-2/server-test/crash-reports/
            long-haul-legacy-2/assembly/jar-registry.json
            long-haul-legacy-2/assembly/package-validation.json
          if-no-files-found: warn
